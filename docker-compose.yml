services:
  # ── Microservice 1: Vector Database (PostgreSQL 16 + pgvector) ─────────
  db:
    image: pgvector/pgvector:pg16
    container_name: chatbot_db
    restart: always
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - chatbot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Microservice 2: MCP Knowledge Server (pgvector + Gemini Embedding) ─
  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: chatbot_mcp_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./mcp_server/.env
    environment:
      - DB_HOST=db
    volumes:
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - chatbot_net

  # ── Microservice 3: Backend FastAPI (Dify & LangGraph + Gemini) ────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: always
    depends_on:
      - mcp_server
    env_file:
      - ./backend/.env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8000/sse
    volumes:
      - ./backend/.env:/app/.env:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - chatbot_net

  # ── Microservice 4: Frontend React (Vite + Nginx Reverse Proxy) ────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: chatbot_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - chatbot_net

volumes:
  pgvector_data:

networks:
  chatbot_net:
    driver: bridge
